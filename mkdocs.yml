site_name: MCP Portal
site_description: MCP Portal - Self-hosted analytics and data tools as MCP servers
docs_dir: docs

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    scheme: default
    primary: black
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Connectors:
    - connectors/index.md
    - Matomo: connectors/matomo.md
    - Google Search Console: connectors/google-search-console.md
    - Castopod: connectors/castopod.md
  - MCP Protocol: mcp-protocol.md
